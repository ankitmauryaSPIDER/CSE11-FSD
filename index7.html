<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABES Engineering College - Online Book Store Registration</title>
  <link rel="stylesheet" href="style7.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="https://www.facultyplus.com/wp-content/uploads/2023/01/abesphoto.jpg" alt="ABES Logo" class="logo">
      <h1>ABES Engineering College</h1>
      <h2>Online Book Store Registration</h2>
    </header>

    <form id="registrationForm" onsubmit="return validateForm()">

      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="email">Email ID:</label>
        <input type="email" id="email" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" placeholder="Enter your 10-digit phone number">
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>

      <div class="form-group">
        <label>Gender:</label>
        <div class="gender">
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
      </div>

      <div class="form-group">
        <label for="course">Course:</label>
        <select id="course">
          <option value="">-- Select Course --</option>
          <option value="CSE">Computer Science Engineering</option>
          <option value="ECE">Electronics and Communication</option>
          <option value="ME">Mechanical Engineering</option>
          <option value="CE">Civil Engineering</option>
          <option value="IT">Information Technology</option>
        </select>
      </div>

      <button type="submit" class="btn">Register</button>
    </form>

    <footer>
      <p>Designed by <span>AMIT SINGH</span></p>
    </footer>
  </div>

  <script src="script7.js"></script>
</body>
</html>
